apiVersion: v1
kind: Namespace
metadata:
  name: ocm-functional-test
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSet
metadata:
  name: ocm-local-test
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: ocm-local-test
  namespace: ocm-functional-test
spec:
  clusterSet: ocm-local-test
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: local-cluster-selection
  namespace: ocm-functional-test
spec:
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            environment: ocm-local-test
